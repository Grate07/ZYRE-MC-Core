services:
  - type: web
    name: zyre-mc-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DB_PATH
        value: /var/data/levels.sqlite
    disk:
      name: zyre-mc-data
      mountPath: /var/data
      sizeGB: 1
