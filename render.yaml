services:
  - type: web
    name: zyre-mc-bot
    runtime: node
    plan: starter
    buildCommand: apt-get update && apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DB_PATH
        value: /var/data/levels.sqlite
    disk:
      name: zyre-mc-data
      mountPath: /var/data
      sizeGB: 1
